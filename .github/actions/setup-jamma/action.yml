name: Setup JAMMA
description: >-
  Install uv, pin the Python version, sync the locked environment, and
  optionally install ILP64 numpy and compile the C extensions.

inputs:
  python-version:
    description: Python version to install via `uv python install`.
    default: "3.12"
  build-extensions:
    description: >-
      Compile `_lmm_accel` and `_jlinalg` after syncing. Set to "false" for
      jobs that only need the locked environment (lint, sdist builds).
    default: "true"
  ilp64-numpy:
    description: >-
      Force-reinstall numpy from the michael-denyer/numpy-mkl index after
      sync, for the ILP64 CI leg.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv python install "$PYTHON_VERSION"

    - name: Install dependencies (uv.lock must be in sync)
      shell: bash
      run: uv sync --locked

    - name: Install MKL ILP64 numpy
      if: inputs.ilp64-numpy == 'true'
      shell: bash
      run: |
        uv run pip install numpy \
          --index-url https://michael-denyer.github.io/numpy-mkl \
          --force-reinstall --upgrade

    - name: Compile C extensions
      if: inputs.build-extensions == 'true'
      shell: bash
      run: uv run python -m jamma.lmm._compile_accel

    - name: Compile jlinalg extension
      if: inputs.build-extensions == 'true'
      shell: bash
      run: uv run python -m jamma.jlinalg._compile_jlinalg
