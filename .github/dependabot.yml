version: 2

# Every ecosystem sets `cooldown`: Dependabot waits this long after a release
# before proposing it. A compromised version is usually yanked within days of
# publication, so waiting is the cheap half of supply-chain defence — the
# other half is the SHA pinning in .github/workflows. Semver-major waits
# longer because those land least often and hurt most.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Python dependencies in pyproject.toml. Weekly cadence keeps ruff,
  # hatchling, numpy, and test deps current so CVE exposure doesn't
  # accumulate silently. Grouped so minor/patch bumps land in one PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # The container's runtime pins. A separate entry because the root pip entry
  # scans root manifests only, so docker/requirements-container.txt was
  # invisible to Dependabot. The runtime half of that file is generated from
  # uv.lock by docker/generate-requirements.py, and a test asserts the two
  # agree, so a bump landing here without a regenerate fails CI rather than
  # drifting silently.
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      container-minor-patch:
        update-types: ["minor", "patch"]

  # The two digest-pinned FROM lines in the Dockerfile. Dependabot rewrites
  # `@sha256:` digests in place, which is the only refresh path a digest pin
  # has: without this, CVE-driven python:3.11.x point releases never arrive.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
