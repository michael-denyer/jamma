name: Build wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Download BLIS binary
        continue-on-error: true
        run: |
          mkdir -p src/jamma/jlinalg/libs
          # Download only the platform-appropriate BLIS binary.
          # The prebuilt libblis-x86_64.so targets glibc 2.39 (Ubuntu 24.04),
          # which is too recent for manylinux_2_28. auditwheel rejects wheels
          # containing .so files with too-recent glibc symbols, even with
          # --exclude. Skip BLIS on Linux — it's dlopen'd at runtime, optional.
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release download v0.2.0 \
              --repo michael-denyer/blis-prebuilt \
              --pattern "libblis-firestorm.dylib" \
              --dir src/jamma/jlinalg/libs/ \
              || echo "BLIS download failed (expected if repo not ready)"
          else
            echo "Skipping BLIS on Linux (glibc version mismatch with manylinux_2_28)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Build for CPython 3.11-3.13 only
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          # Skip 32-bit, musllinux, and Windows
          CIBW_SKIP: "*-win* *-manylinux_i686 *-musllinux*"
          # macOS: build arm64 only (Intel Mac is EOL)
          CIBW_ARCHS_MACOS: "arm64"
          # macOS deployment target: bundled BLIS (blis-prebuilt v0.2.0) was
          # compiled for macOS 14.0. delocate checks all bundled dylibs against
          # the wheel's platform tag and rejects mismatches. arm64 requires
          # 11.0+ anyway; 14.0 is Sonoma (2023), reasonable minimum.
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=14.0'
          # Linux: x86_64 only. Skip BLIS — prebuilt .so targets glibc 2.39,
          # incompatible with manylinux_2_28. Linux wheels use jlinalg-own dgemm.
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ENVIRONMENT_LINUX: 'JLINALG_SKIP_BLIS=1'
          # Install libgomp in manylinux_2_28 container (AlmaLinux 8, dnf)
          CIBW_BEFORE_BUILD_LINUX: "dnf install -y libgomp"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v -e libblis {wheel}"
          # Smoke test: import + numerical sanity (catches ABI mismatches)
          CIBW_TEST_COMMAND: >-
            python {project}/scripts/smoke_test_c_extension.py &&
            python {project}/scripts/smoke_test_eigen_extension.py &&
            python {project}/scripts/smoke_test_jlinalg.py
          # Install test deps (numpy required for import)
          CIBW_TEST_REQUIRES: "numpy"

      - name: Verify wheel contents
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(./wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "FAIL: no wheels found"
            exit 1
          fi
          for whl in "${wheels[@]}"; do
            tmpdir=$(mktemp -d)
            unzip -q "$whl" -d "$tmpdir"
            # Check for BLIS binary in wheel
            blis=$(find "$tmpdir" -path '*/jlinalg/libs/libblis*' | head -1)
            if [ -n "$blis" ]; then
              echo "OK: BLIS bundled in $(basename "$whl"): $(basename "$blis")"
            else
              echo "INFO: No BLIS in $(basename "$whl") (jlinalg own dgemm will be used)"
            fi
            rm -rf "$tmpdir"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_avx2_wheels:
    name: Build AVX2 wheels (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BLIS binary
        continue-on-error: true
        run: |
          mkdir -p src/jamma/jlinalg/libs
          # Download only the platform-appropriate BLIS binary.
          # The prebuilt libblis-x86_64.so targets glibc 2.39 (Ubuntu 24.04),
          # which is too recent for manylinux_2_28. auditwheel rejects wheels
          # containing .so files with too-recent glibc symbols, even with
          # --exclude. Skip BLIS on Linux — it's dlopen'd at runtime, optional.
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release download v0.2.0 \
              --repo michael-denyer/blis-prebuilt \
              --pattern "libblis-firestorm.dylib" \
              --dir src/jamma/jlinalg/libs/ \
              || echo "BLIS download failed (expected if repo not ready)"
          else
            echo "Skipping BLIS on Linux (glibc version mismatch with manylinux_2_28)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AVX2-optimized wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Build for CPython 3.11-3.13, Linux x86_64 only
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          # AVX2 optimization flags via CFLAGS (picked up by hatch_build.py).
          # Skip BLIS — prebuilt .so targets glibc 2.39, incompatible with manylinux_2_28.
          CIBW_ENVIRONMENT_LINUX: 'CFLAGS="-march=x86-64-v3 -mavx2" JLINALG_SKIP_BLIS=1'
          # Install libgomp in manylinux container (AlmaLinux 8, dnf)
          CIBW_BEFORE_BUILD_LINUX: "dnf install -y libgomp"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          # Same smoke tests as baseline wheels
          CIBW_TEST_COMMAND: >-
            python {project}/scripts/smoke_test_c_extension.py &&
            python {project}/scripts/smoke_test_eigen_extension.py &&
            python {project}/scripts/smoke_test_jlinalg.py
          CIBW_TEST_REQUIRES: "numpy"

      - name: Verify AVX2 instructions in wheels
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(./wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "FAIL: no wheels found in ./wheelhouse/"
            exit 1
          fi
          for whl in "${wheels[@]}"; do
            tmpdir=$(mktemp -d)
            unzip -q "$whl" -d "$tmpdir"
            so=$(find "$tmpdir" -name '_lmm_accel*.so' | head -1)
            if [ -z "$so" ]; then
              echo "FAIL: no _lmm_accel .so found in $whl"
              exit 1
            fi
            if ! objdump -d "$so" | grep -q 'vmovdqu\|vbroadcastsd\|vfmadd'; then
              echo "FAIL: no AVX2 instructions found in $so"
              exit 1
            fi
            echo "OK: AVX2 instructions verified in $(basename "$whl") [_lmm_accel]"
            # Verify _jlinalg.so also contains AVX2 instructions
            jlinalg_so=$(find "$tmpdir" -name '_jlinalg*.so' | head -1)
            if [ -z "$jlinalg_so" ]; then
              echo "FAIL: no _jlinalg .so found in $(basename "$whl")"
              exit 1
            fi
            if ! objdump -d "$jlinalg_so" | grep -q 'vfmadd\|vmulpd\|vaddpd'; then
              echo "FAIL: no AVX2 instructions in $jlinalg_so"
              exit 1
            fi
            echo "OK: AVX2 instructions verified in $(basename "$whl") [_jlinalg]"
            rm -rf "$tmpdir"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: avx2-wheels
          path: ./wheelhouse/*.whl

  # Attach AVX2 wheels to GitHub Release (NOT uploaded to PyPI — same
  # platform tags as baseline wheels would conflict). Users wanting AVX2
  # can download from the release assets and pip install the .whl directly.
  upload_avx2_release:
    name: Attach AVX2 wheels to release
    needs: [build_avx2_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avx2-wheels
          path: avx2-dist

      - name: Upload AVX2 wheels to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" avx2-dist/*.whl --clobber --repo "$GH_REPO"

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5.3.0

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-latest
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
