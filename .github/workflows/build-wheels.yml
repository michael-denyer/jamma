name: Build wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Build for CPython 3.11-3.13 only
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          # Skip 32-bit, musllinux, and Windows
          CIBW_SKIP: "*-win* *-manylinux_i686 *-musllinux*"
          # macOS: build arm64 only (Intel Mac is EOL)
          CIBW_ARCHS_MACOS: "arm64"
          # Linux: x86_64 only
          CIBW_ARCHS_LINUX: "x86_64"
          # Install libgomp in manylinux_2_28 container (AlmaLinux 8, dnf)
          CIBW_BEFORE_BUILD_LINUX: "dnf install -y libgomp"
          # macOS: no libomp install — C extension compiles single-threaded
          # (still faster than Python loops; users can build from source with
          # brew install libomp for OpenMP support)
          # Smoke test: import + numerical sanity (catches ABI mismatches)
          CIBW_TEST_COMMAND: "python {project}/scripts/smoke_test_c_extension.py"
          # Install test deps (numpy required for import)
          CIBW_TEST_REQUIRES: "numpy"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5.3.0

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
