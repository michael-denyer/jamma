name: Build wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # Build for CPython 3.11-3.13 only
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          # Skip 32-bit, musllinux, and Windows
          CIBW_SKIP: "*-win* *-manylinux_i686 *-musllinux*"
          # macOS: build arm64 only (Intel Mac is EOL)
          CIBW_ARCHS_MACOS: "arm64"
          # Linux: x86_64 only
          CIBW_ARCHS_LINUX: "x86_64"
          # Install libgomp in manylinux container (yum-based images)
          CIBW_BEFORE_BUILD_LINUX: "yum install -y libgomp"
          # Test import + numerical sanity (catches ABI mismatches that silently corrupt results)
          CIBW_TEST_COMMAND: >-
            python -c "
            from jamma.lmm._lmm_accel import compute_lmm_batch_c, HAS_OPENMP;
            import numpy as np;
            print(f'C extension OK, OpenMP={bool(HAS_OPENMP)}');
            rng = np.random.default_rng(42);
            n = 50;
            eig = np.sort(rng.uniform(0.1, 2.0, n));
            Uab = rng.standard_normal((3, n, 6));
            Uab[:, :, 0] = np.abs(Uab[:, :, 0]) + 0.1;
            Iab = np.zeros((3, 3, 6));
            Iab[:, 0, :] = Uab.sum(axis=1);
            Iab[:, 1, 3] = Iab[:, 0, 3] - Iab[:, 0, 1]**2 / Iab[:, 0, 0];
            Iab[:, 1, 4] = Iab[:, 0, 4] - Iab[:, 0, 1] * Iab[:, 0, 2] / Iab[:, 0, 0];
            Iab[:, 1, 5] = Iab[:, 0, 5] - Iab[:, 0, 2]**2 / Iab[:, 0, 0];
            Iab[:, 2, 5] = Iab[:, 1, 5] - Iab[:, 1, 4]**2 / np.where(Iab[:, 1, 3] != 0, Iab[:, 1, 3], 1.0);
            r = compute_lmm_batch_c(eig, Uab, Iab, n, 1e-5, 1e5, 50, 20, 1);
            assert all(np.isfinite(r[k]).all() for k in ('lambdas', 'betas', 'ses')), 'Non-finite outputs';
            print('Numerical sanity check passed');
            "
          # Install test deps (numpy required for import)
          CIBW_TEST_REQUIRES: "numpy"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5.3.0

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
