name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and format check via pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "Linux + JAX"
            cov_threshold: "--cov-fail-under=80"
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra dev"
            name: "Linux + NumPy"
            pytest_args: "-m 'not tier2 and not slow and not requires_jax'"
            cov_threshold: "--cov-fail-under=50"
          - os: ubuntu-latest
            python-version: "3.11"
            install_args: "--extra jax --extra dev"
            name: "Linux + JAX (3.11)"
            cov_threshold: "--cov-fail-under=80"
          - os: macos-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "ARM Mac + JAX"
            cov_threshold: "--cov-fail-under=80"
          - os: windows-latest
            python-version: "3.12"
            install_args: "--extra dev"
            name: "Windows + NumPy"
            pytest_args: "-m 'not tier2 and not slow and not requires_jax'"
            cov_threshold: "--cov-fail-under=50"
    name: ${{ matrix.name }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync ${{ matrix.install_args }}

      - name: Run tests
        run: uv run pytest ${{ matrix.pytest_args || '-m "not tier2 and not slow"' }} -v --cov=src/jamma --cov-report=term-missing ${{ matrix.cov_threshold }}

  test-slow:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run slow and tier2 tests
        run: uv run pytest -m "tier2 or slow" -v --no-cov
