name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and format check via pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "Linux + JAX"
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra dev"
            name: "Linux + NumPy"
            pytest_args: "-m 'not tier2 and not tier3 and not slow and not requires_jax and not benchmark'"
          - os: ubuntu-latest
            python-version: "3.11"
            install_args: "--extra jax --extra dev"
            name: "Linux + JAX (3.11)"
          - os: macos-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "ARM Mac + JAX"
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "Linux + MKL ILP64"
            ilp64_numpy: true
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "Linux + BLIS ILP64"
            blis_ilp64: true
    name: ${{ matrix.name }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync ${{ matrix.install_args }}

      - name: Install MKL ILP64 numpy
        if: matrix.ilp64_numpy
        run: |
          uv run pip install numpy \
            --extra-index-url https://michael-denyer.github.io/numpy-mkl \
            --force-reinstall --upgrade
          uv run python -c "
          import numpy as np
          cfg = np.show_config('dicts')
          blas = cfg.get('Build Dependencies', {}).get('blas', {})
          print(f'numpy BLAS: {blas}')
          "

      - name: Download BLIS ILP64 binary
        if: matrix.blis_ilp64
        run: |
          mkdir -p src/jamma/jlinalg/libs
          gh release download v0.2.0 \
            --repo michael-denyer/blis-prebuilt \
            --pattern "libblis-x86_64.so" \
            --dir src/jamma/jlinalg/libs/ \
            --clobber
          mv src/jamma/jlinalg/libs/libblis-x86_64.so src/jamma/jlinalg/libs/libblis.so
          echo "BLIS ILP64 binary ready:"
          ls -lh src/jamma/jlinalg/libs/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Verify BLAS backend
        run: |
          uv run python -c "
          from jamma.jlinalg import blas_backend, blas_is_ilp64, HAS_C_EXTENSION
          print(f'HAS_C_EXTENSION={HAS_C_EXTENSION}')
          print(f'blas_backend={blas_backend}')
          print(f'blas_is_ilp64={blas_is_ilp64}')
          "

      - name: Run tests
        run: uv run pytest ${{ matrix.pytest_args || '-m "not tier2 and not tier3 and not slow and not benchmark"' }} -v -n 3 -o 'addopts='

  coverage:
    name: Coverage (slipcover)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra jax --extra dev

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run tests with slipcover
        run: uv run slipcover --source src/jamma --fail-under 80 -m pytest -m "not tier2 and not tier3 and not slow and not benchmark" -v -n0 -o 'addopts='
