name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check via pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            name: "Linux + NumPy (3.12)"
          - os: ubuntu-latest
            python-version: "3.11"
            name: "Linux + NumPy (3.11)"
          - os: macos-latest
            python-version: "3.12"
            name: "ARM Mac + NumPy"
          - os: ubuntu-latest
            python-version: "3.12"
            name: "Linux + MKL ILP64"
            ilp64_numpy: true
    name: ${{ matrix.name }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Install MKL ILP64 numpy
        if: matrix.ilp64_numpy
        run: |
          uv run pip install numpy \
            --extra-index-url https://michael-denyer.github.io/numpy-mkl \
            --force-reinstall --upgrade
          uv run python -c "
          import numpy as np
          cfg = np.show_config('dicts')
          blas = cfg.get('Build Dependencies', {}).get('blas', {})
          print(f'numpy BLAS: {blas}')
          "

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Verify BLAS backend
        run: |
          uv run python -c "
          from jamma.jlinalg import blas_backend, blas_is_ilp64, HAS_C_EXTENSION
          print(f'HAS_C_EXTENSION={HAS_C_EXTENSION}')
          print(f'blas_backend={blas_backend}')
          print(f'blas_is_ilp64={blas_is_ilp64}')
          "

      - name: Run tests
        # addopts= clears pyproject.toml defaults so CI controls markers and parallelism explicitly
        run: uv run pytest ${{ matrix.pytest_args || '-m "not tier2 and not tier3 and not slow and not benchmark"' }} -v -n 3 -o 'addopts='

  coverage:
    name: Coverage (slipcover)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run tests with slipcover
        run: uv run slipcover --source src/jamma --fail-under 80 -m pytest -m "not tier2 and not tier3 and not slow and not benchmark" -v -n0 -o 'addopts='
