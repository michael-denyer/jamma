name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref — saves CI minutes and gets
# feedback to contributors faster. Only the latest push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Node is required by prek hooks that use language: node
      # (markdownlint-cli2) and by the maid-mermaid wrapper script which
      # shells out to `npx @probelabs/maid`.
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "22"

      - name: Install prek
        uses: j178/prek-action@53276d8b0d10f8b6672aa85b4588c6921d0370cc  # v2
        with:
          install-only: true

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check
        run: prek run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            name: "Linux + NumPy (3.12)"
          - os: ubuntu-latest
            python-version: "3.11"
            name: "Linux + NumPy (3.11)"
          - os: macos-latest
            python-version: "3.12"
            name: "ARM Mac + NumPy"
          - os: ubuntu-latest
            python-version: "3.12"
            name: "Linux + MKL ILP64"
            ilp64_numpy: true
    name: ${{ matrix.name }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Install MKL ILP64 numpy
        if: matrix.ilp64_numpy
        run: |
          uv run pip install numpy \
            --index-url https://michael-denyer.github.io/numpy-mkl \
            --force-reinstall --upgrade
          uv run python -c "
          import numpy as np
          cfg = np.show_config('dicts')
          blas = cfg.get('Build Dependencies', {}).get('blas', {})
          print(f'numpy BLAS: {blas}')
          "

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Verify BLAS backend
        run: |
          uv run python -c "
          from jamma.jlinalg import blas_backend, blas_is_ilp64, HAS_C_EXTENSION
          assert HAS_C_EXTENSION, 'C extension failed to load — aborting CI'
          print(f'HAS_C_EXTENSION={HAS_C_EXTENSION}')
          print(f'blas_backend={blas_backend}')
          print(f'blas_is_ilp64={blas_is_ilp64}')
          "

      - name: Run tests
        # addopts= clears pyproject.toml defaults so CI controls markers and parallelism explicitly
        run: uv run pytest ${{ matrix.pytest_args || '-m "not tier2 and not tier3 and not slow and not benchmark"' }} -v -n 3 -o 'addopts='

  coverage:
    name: Coverage (slipcover)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run tests with slipcover
        run: uv run slipcover --source src/jamma --fail-under 80 -m pytest -m "not tier2 and not tier3 and not slow and not benchmark" -v -n0 -o 'addopts='

  # Markdown link checker (offline). Runs on every PR and verifies that
  # every relative link and anchor in every .md file resolves. Does not
  # hit the network, so PRs can't be blocked by unrelated upstream hiccups.
  #
  # Consistency: lychee.toml is the shared source of truth for exclude
  # rules. The pre-commit hook (.pre-commit-config.yaml) runs the same
  # binary with the same config and the same --offline flag. If this CI
  # job passes, the local hook will too.
  #
  # External (online) link checking runs separately in link-check-external
  # on a weekly schedule, to avoid PR-time flakes from third-party servers.
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Run lychee (offline)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          args: --offline --no-progress --config lychee.toml './**/*.md'
          fail: true
