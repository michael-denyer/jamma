name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and format check via pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "Linux + JAX"
            cov_threshold: "--cov-fail-under=80"
          - os: ubuntu-latest
            python-version: "3.12"
            install_args: "--extra dev"
            name: "Linux + NumPy"
            pytest_args: "-m 'not tier2 and not slow and not requires_jax'"
            cov_threshold: "--cov-fail-under=60"
          - os: ubuntu-latest
            python-version: "3.11"
            install_args: "--extra jax --extra dev"
            name: "Linux + JAX (3.11)"
            cov_threshold: "--cov-fail-under=80"
          - os: macos-latest
            python-version: "3.12"
            install_args: "--extra jax --extra dev"
            name: "ARM Mac + JAX"
            cov_threshold: "--cov-fail-under=80"
    name: ${{ matrix.name }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync ${{ matrix.install_args }}

      - name: Debug numpy BLAS layout
        if: runner.os == 'Linux'
        run: |
          uv run python -c "
          import pathlib, numpy
          np_dir = pathlib.Path(numpy.__file__).resolve().parent
          print(f'numpy.__file__ = {numpy.__file__}')
          print(f'resolved np_dir = {np_dir}')
          print(f'np_dir.parent = {np_dir.parent}')
          for d in [np_dir / '.libs', np_dir / '_core' / '.libs', np_dir.parent / 'numpy.libs']:
              print(f'{d}: exists={d.exists()}, is_dir={d.is_dir()}')
              if d.is_dir():
                  for f in sorted(d.iterdir()):
                      print(f'  {f.name}')
          try:
              cfg = numpy.show_config(mode='dicts')
              bd = cfg.get('Build Dependencies', {})
              for k in ['blas', 'lapack']:
                  info = bd.get(k, {})
                  print(f'{k}: {info}')
          except Exception as e:
              print(f'show_config failed: {e}')
          "

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel
          uv run python -m jamma.lmm._compile_eigen

      - name: Run tests
        run: uv run pytest ${{ matrix.pytest_args || '-m "not tier2 and not slow"' }} -v -o 'addopts=' --cov=src/jamma --cov-report=term-missing --cov-report=json ${{ matrix.cov_threshold }}

      - name: Check per-module coverage minimums
        if: matrix.name == 'Linux + JAX'
        run: uv run python scripts/check_module_coverage.py

  test-slow:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run slow and tier2 tests
        run: uv run pytest -m "tier2 or slow" -v -o 'addopts=' --no-cov
