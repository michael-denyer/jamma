name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref — saves CI minutes and gets
# feedback to contributors faster. Only the latest push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # cppcheck is built from source rather than installed from apt. The
      # bare `apt-get install -y cppcheck` this replaces had two defects:
      # it resolved to whatever the runner image carried (2.13.0), so an
      # image bump could start failing the lint job with no code change;
      # and 2.13.0 is eight releases behind the 2.21.0 the local prek hook
      # runs, so CI's linter could never catch anything the hook missed.
      # Bumping means updating both values below together.
      CPPCHECK_VERSION: "2.21.0"
      CPPCHECK_COMMIT: e73bf44c3e49686b7495fab352d03a6c6075516b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Cache cppcheck ${{ env.CPPCHECK_VERSION }}
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Spelled literally rather than shared with the run steps below:
          # actions/cache expands a leading ~ itself, bash needs $HOME.
          path: ~/.local/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ env.CPPCHECK_COMMIT }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build cppcheck ${{ env.CPPCHECK_VERSION }}
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CPPCHECK_VERSION" \
            https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
          # Tags are mutable. The commit is what we agreed to build.
          test "$(git -C /tmp/cppcheck-src rev-parse HEAD)" = "$CPPCHECK_COMMIT"
          cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/cppcheck"
          cmake --build /tmp/cppcheck-build -j "$(nproc)"
          cmake --install /tmp/cppcheck-build

      - name: Verify cppcheck
        run: |
          echo "$HOME/.local/cppcheck/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/cppcheck/bin:$PATH"
          # Exact match. A cache restored under a stale key, or an upstream
          # re-tag, has to fail here rather than silently lint with the
          # wrong check set.
          test "$(cppcheck --version)" = "Cppcheck $CPPCHECK_VERSION"
          # Loads the bundled cfg/ from share/Cppcheck/. A cache that lost
          # that directory still answers --version, then fails much later
          # with a message buried in the hook output.
          cppcheck --errorlist > /dev/null

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Node is required by prek hooks that use language: node
      # (markdownlint-cli2) and by the maid-mermaid wrapper script which
      # shells out to `npx @probelabs/maid`.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Install prek
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16  # v2
        with:
          install-only: true

      - name: Install dependencies
        run: uv sync

      # uv.lock must match pyproject.toml. The pre-commit uv-lock-sync
      # hook catches this locally, but only if contributors run prek
      # before pushing. `uv lock --check` fails if the lockfile is stale,
      # closing the gap for PRs that bypass hooks.
      - name: uv.lock sync check
        run: uv lock --check

      # Ruff check and format split into separate steps so a failure
      # report names the exact rule set that failed (check rules vs
      # unformatted files) rather than a generic "files were modified".
      - name: Ruff check (no autofix)
        run: uv run ruff check --no-fix .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Static type check. Gates only NEW type errors: the committed
      # pyrefly-baseline.json snapshots the pre-existing backlog, and this
      # step fails only when an error not in the baseline appears. Reads
      # .pyi stubs (no compiled C extension needed), so it runs in the lint
      # job without a build step. Config is in [tool.pyrefly] (pyproject.toml).
      # Split out from `prek run` below (which also runs it) so a failure
      # report names the type checker explicitly, mirroring the ruff steps.
      - name: Pyrefly type check
        run: uv run pyrefly check --baseline pyrefly-baseline.json

      - name: Lint and format check
        run: prek run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            name: "Linux + NumPy (3.12)"
          - os: ubuntu-latest
            python-version: "3.11"
            name: "Linux + NumPy (3.11)"
          - os: macos-latest
            python-version: "3.12"
            name: "ARM Mac + NumPy"
          - os: ubuntu-latest
            python-version: "3.12"
            name: "Linux + MKL ILP64"
            ilp64_numpy: true
    name: ${{ matrix.name }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Install MKL ILP64 numpy
        if: matrix.ilp64_numpy
        run: |
          uv run pip install numpy \
            --index-url https://michael-denyer.github.io/numpy-mkl \
            --force-reinstall --upgrade
          uv run python -c "
          import numpy as np
          cfg = np.show_config('dicts')
          blas = cfg.get('Build Dependencies', {}).get('blas', {})
          print(f'numpy BLAS: {blas}')
          "

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Verify BLAS backend
        run: |
          uv run python -c "
          from jamma.jlinalg import blas_backend, blas_is_ilp64, HAS_C_EXTENSION
          assert HAS_C_EXTENSION, 'C extension failed to load — aborting CI'
          print(f'HAS_C_EXTENSION={HAS_C_EXTENSION}')
          print(f'blas_backend={blas_backend}')
          print(f'blas_is_ilp64={blas_is_ilp64}')
          "

      - name: Run tests
        # addopts= clears pyproject.toml defaults so CI controls markers and parallelism explicitly.
        # --reruns 1 (one retry on failure) absorbs the documented timing-flake class on
        # heavily-loaded ARM Mac runners. Real failures still surface — they fail on the rerun
        # too. Linux runners keep the historical zero-retry policy. The flaky-detect.yml
        # workflow continues to monitor seed-sensitive flakes that survive --reruns.
        shell: bash
        run: |
          set -eo pipefail
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            extra_args=(--reruns 1 --only-rerun TimeoutError --only-rerun AssertionError)
          else
            extra_args=()
          fi
          uv run pytest -m "not tier2 and not slow and not benchmark" -v -n 3 -o 'addopts=' "${extra_args[@]}"

  # Package smoke test: catches (a) sdist missing critical files
  # (e.g. src/jamma/_build_support/*.py needed for runtime recompile),
  # (b) wheel missing .py/.so files, and (c) wheel that cannot be
  # installed + imported in a clean venv (the real end-user path).
  # Runs once per PR rather than per matrix leg — these failures are
  # platform-independent.
  package-smoke:
    name: Package smoke (sdist + wheel import)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      # Both archives must ship _build_support/ — without it, the runtime
      # ABI-mismatch recompile path (jamma.core.recompile) fails on
      # end-user machines after a wheel install. This is a structural
      # check; the wheel import step below exercises the runtime path.
      - name: Verify _build_support ships in sdist
        run: |
          SDIST=$(ls dist/*.tar.gz)
          echo "Inspecting: $SDIST"
          tar tzf "$SDIST" | grep -E "_build_support/(compile_and_link|find_compiler|openmp_detect)\.py$" || {
            echo "::error::sdist is missing _build_support/ modules"
            tar tzf "$SDIST" | grep _build_support || echo "(no matches)"
            exit 1
          }

      - name: Verify _build_support ships in wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Inspecting: $WHEEL"
          uv run python -c "
          import sys, zipfile
          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
          required = [
              'jamma/_build_support/compile_and_link.py',
              'jamma/_build_support/find_compiler.py',
              'jamma/_build_support/openmp_detect.py',
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print(f'::error::wheel missing _build_support modules: {missing}')
              sys.exit(1)
          print(f'wheel contains all required _build_support modules')
          " "$WHEEL"

      # Real-user path: install the built wheel into a fresh venv (no
      # source checkout on path) and verify import + CLI entry point.
      # Catches the exact regression a dev-only flag would produce
      # (wheel built with -march=native crashes on older CPUs during
      # import of the C extension — not caught by source-install tests).
      - name: Import-test wheel in scratch venv
        run: |
          WHEEL=$(ls dist/*.whl)
          python3.12 -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install "$WHEEL"
          /tmp/smoke_venv/bin/python -c "
          import jamma
          print(f'jamma.__version__={jamma.__version__}')
          # CLI entry point must resolve cleanly.
          from jamma.cli import main
          print('CLI entry point imports OK')
          "
          /tmp/smoke_venv/bin/jamma --help > /dev/null

  coverage:
    name: Coverage (slipcover)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run tests with slipcover
        run: |
          uv run slipcover \
            --source src/jamma \
            --json --out coverage.json \
            --fail-under 80 \
            -m pytest -m "not tier2 and not slow and not benchmark" -v -n0 -o 'addopts='

      - name: Per-subsystem coverage thresholds
        # Stricter floor for the high-risk numerical subsystems. The
        # global --fail-under 80 above is a coarse gate; this step makes
        # sure regressions in lmm/jlinalg/kinship/io can't be hidden by
        # over-tested utility modules.
        run: uv run python scripts/check_subsystem_coverage.py coverage.json

  # Markdown link checker (offline). Runs on every PR and verifies that
  # every relative link and anchor in every .md file resolves. Does not
  # hit the network, so PRs can't be blocked by unrelated upstream hiccups.
  #
  # Consistency: lychee.toml is the shared source of truth for exclude
  # rules. The pre-commit hook (.pre-commit-config.yaml) runs the same
  # binary with the same config and the same --offline flag. If this CI
  # job passes, the local hook will too.
  #
  # External (online) link checking runs separately in link-check-external
  # on a weekly schedule, to avoid PR-time flakes from third-party servers.
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Run lychee (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --offline --no-progress --config lychee.toml './**/*.md'
          fail: true
