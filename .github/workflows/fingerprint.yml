name: Fingerprint

# Bit-exactness gate for the LMM accelerator.
#
# Tolerance-based tests do not catch last-bit drift: a -ffp-contract=off
# mutation once changed 21 of 22 compute entry points while all 133 accel tests
# still passed. scripts/lmm_accel_fingerprint.py exists to catch exactly that,
# but until this workflow it only ever ran because someone remembered to.
#
# There is no committed baseline to compare against, and there cannot be: the
# digests depend on the compiler and the CPU, and dev builds use -march=native.
# So the job builds both sides itself on one runner, where the only variable
# left is the source.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/jamma/lmm/_lmm_*.c"
      - "src/jamma/lmm/_lmm_*.h"
      - "src/jamma/_build_support/**"
      - "scripts/lmm_accel_fingerprint.py"
      - "scripts/compare_fingerprints.py"
      - "scripts/run-fingerprint.sh"
      - ".github/workflows/fingerprint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bit-exactness:
    name: Bit-exactness vs merge base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # merge-base needs the full history of both sides.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve the merge base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          base_sha=$(git merge-base "origin/${BASE_REF}" HEAD)
          echo "head=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "base=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "Comparing ${head_sha} against merge base ${base_sha}"
          if ! git cat-file -e "${base_sha}:scripts/lmm_accel_fingerprint.py" 2>/dev/null; then
            echo "::error::The merge base predates the fingerprint harness, so there is nothing to compare against. Rebase onto a commit that has scripts/lmm_accel_fingerprint.py."
            exit 1
          fi

      # Both runs go through one copy of the runner, kept outside the worktree
      # so the base checkout cannot swap it for an older version. Identical
      # pytest arguments on both sides is what makes the record keys line up.
      # Both sides must run the head's harness: the runner for identical pytest
      # arguments, and the recorder because it decides how records are keyed.
      # A recorder that keys differently on the two sides shares no records
      # and the comparison finds nothing to compare while looking like it ran.
      - name: Stage the fingerprint harness
        run: |
          install -m 755 scripts/run-fingerprint.sh "${RUNNER_TEMP}/run-fingerprint.sh"
          install -m 644 scripts/lmm_accel_fingerprint.py "${RUNNER_TEMP}/lmm_accel_fingerprint.py"

      # HEAD first, so a build failure lands against the code under review
      # rather than against the base.
      - name: Fingerprint the PR head
        run: |
          set -euo pipefail
          rm -f src/jamma/lmm/_lmm_accel*.so
          uv sync --locked
          uv run python -m jamma.lmm._compile_accel
          "${RUNNER_TEMP}/run-fingerprint.sh" "${RUNNER_TEMP}/head.txt"

      # The .so is gitignored, so the checkout below leaves the head's build in
      # place. Each side has to compile from nothing, or the base build starts
      # by importing the head's extension: if the two disagree on ABI_VERSION
      # that trips auto-recompile, and its verifying re-import gets CPython's
      # cached single-phase module rather than the freshly linked one, so the
      # step fails reporting a symbol that the base does export.
      - name: Fingerprint the merge base
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          git checkout --detach "${BASE_SHA}"
          install -m 644 "${RUNNER_TEMP}/lmm_accel_fingerprint.py" scripts/lmm_accel_fingerprint.py
          rm -f src/jamma/lmm/_lmm_accel*.so
          uv sync --locked
          uv run python -m jamma.lmm._compile_accel
          "${RUNNER_TEMP}/run-fingerprint.sh" "${RUNNER_TEMP}/base.txt"

      - name: Compare
        env:
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          set -euo pipefail
          git checkout --force --detach "${HEAD_SHA}"
          uv run python scripts/compare_fingerprints.py \
            "${RUNNER_TEMP}/base.txt" "${RUNNER_TEMP}/head.txt"

      - name: Keep the fingerprints for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fingerprints
          path: |
            ${{ runner.temp }}/base.txt
            ${{ runner.temp }}/head.txt
          if-no-files-found: warn
          retention-days: 14
