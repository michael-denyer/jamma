name: Flaky-Test Detection

# Rotate the pytest-randomly seed across multiple weekly runs and report any
# tests that fail under one seed but pass under another. This catches:
#
#   * Order-dependent tests (ones that rely on a previous test's side effect).
#   * Hypothesis-driven tests with hidden seed-dependent flakes.
#   * RNG-seeded synthetic fixtures whose tolerance bounds are tight under
#     unlucky seeds but pass under the default ``--randomly-seed=last``.
#
# Non-blocking: scheduled only, never on PR. Failures here open a triage
# task — not a merge gate.

on:
  schedule:
    # Sundays 06:00 UTC. Earlier than CI to avoid contending for runners
    # with weekday push traffic.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Comma-separated seeds (default rotates 5)'
        default: ''
        required: false

# Default for every job. issues: write is granted to flake-summary alone,
# the only job that files anything, so the matrix job that runs untrusted-ish
# test code holds a read-only token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rotate-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Five distinct seeds. Keep small until we measure flake rate;
        # bumping is cheap once the workflow is established.
        seed: [11, 41867, 2718281, 31415926, 1234567890]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up JAMMA
        uses: ./.github/actions/setup-jamma

      - name: Run default suite under seed ${{ matrix.seed }}
        run: |
          uv run pytest \
            --randomly-seed=${{ matrix.seed }} \
            --no-cov \
            -o "addopts=-n 3 --timeout=120 --benchmark-skip -m 'not slow and not tier2'"

  flake-summary:
    needs: rotate-seeds
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # to file a triage issue on flake detection
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Open or update flake-triage issue on failure
        if: needs.rotate-seeds.result != 'success'
        uses: ./.github/actions/triage-issue
        with:
          title: "Flaky-test detection: weekly seed rotation failed"
          label: flaky-test
          body: |
            Weekly seed-rotation run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            failed for at least one seed. Inspect the matrix run logs to find which seed surfaced the flake.

            This is a non-blocking triage signal — not a merge regression.
            Reproduce locally with: `uv run pytest --randomly-seed=<seed>`.
