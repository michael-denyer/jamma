name: External Link Check

# Weekly online link checker. Separate from ci.yml because external link
# health is out-of-band (third-party servers flake, rate-limit, disappear),
# and those failures should not block PRs or commits. Instead, this
# workflow runs on a schedule and opens a tracking issue when it finds
# broken links.
#
# Consistency with ci.yml's link-check job:
# - Both jobs use the same lychee binary version and the same lychee.toml
#   shared config. The binary version comes from the explicit
#   `lycheeVersion:` input below, NOT from the lychee-action SHA — the
#   action's own default floats (it was v0.24.2 at v2.9.0), so pinning the
#   action alone does not pin the binary. Keep the three entry points in
#   step: this file, ci.yml's link-check, and .pre-commit-config.yaml's
#   `rev: lychee-v<version>`.
# - ci.yml's link-check uses --offline and runs on every PR (fast,
#   deterministic, no network).
# - This workflow omits --offline so external URLs are actually fetched.
# - Any flag that changes *which links are checked* belongs in lychee.toml
#   so the two jobs stay in sync. Flags that change *execution mode*
#   (--offline, tokens, output) live on the command line here.

on:
  schedule:
    - cron: "0 7 * * 1"  # Monday 07:00 UTC
  workflow_dispatch:

# Job-scoped rather than workflow-wide, matching flaky-detect.yml and
# sanitizers.yml. Only one job exists today, so zizmor does not flag the
# wider grant — but the narrow form stays correct if a second one appears.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # to file a triage issue on broken external links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Run lychee (online)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Same binary version as the pre-commit hook and the CI
          # link-check job. See the comment on that job in ci.yml.
          lycheeVersion: v0.24.2
          args: --no-progress --config lychee.toml './**/*.md'
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6.0.0
        with:
          title: External link check found broken links
          content-filepath: ./lychee/out.md
          labels: |
            docs
            link-check
