name: Publish to TestPyPI

# Production PyPI publishing is handled by build-wheels.yml (platform wheels + sdist).
# This workflow is for manual TestPyPI publishes only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          # Disable setup-uv's default cache: zizmor flags it as
          # cache-poisoning risk on a job that publishes signed
          # release artifacts. Cache contents are user-controlled
          # across runs; disabling eliminates the replacement attack
          # surface on a publish job.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: 'dist/*'

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
