name: Publish to TestPyPI

# Production PyPI publishing is handled by build-wheels.yml (platform wheels + sdist).
# This workflow is for manual TestPyPI publishes only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Disable setup-uv's default cache: zizmor flags it as
          # cache-poisoning risk on a job that publishes signed
          # release artifacts. Cache contents are user-controlled
          # across runs; disabling eliminates the replacement attack
          # surface on a publish job.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
