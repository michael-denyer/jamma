name: Resolve dependency updates
on:
  pull_request:
    paths:
      - '.github/workflows/resolve-555.yml'
permissions:
  contents: read
jobs:
  resolve:
    if: github.event.pull_request.number == 555
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - name: Resolve Python pins and emit lockfile patch
        run: |
          set -euo pipefail
          uv lock -P click==8.5.1 -P progressbar2==4.7.0 -P python-utils==4.2.0 -P threadpoolctl==3.8.0
          uv lock --check
          echo "LOCK_SHA=$(sha256sum uv.lock | cut -d' ' -f1)"
          echo "LOCK_PATCH=$(git diff -- uv.lock | gzip -n | base64 -w0)"
      - name: Resolve the Linux Intel runtime
        run: |
          set -euo pipefail
          uv pip compile --python-version 3.12 --python-platform x86_64-manylinux_2_36 --only-binary :all: --no-header --no-annotate -o /tmp/linux-intel.txt - <<< 'mkl==2026.2.0'
          cat /tmp/linux-intel.txt
