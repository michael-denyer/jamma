name: Sanitizers (ASAN + UBSAN)

# Weekly ASAN/UBSAN run rebuilds the C extensions with -fsanitize=address,
# undefined and runs the test suite under instrumentation. Catches:
#
#   * Heap/stack buffer overflows in _lmm_accel.c and _jlinalg.so
#   * Use-after-free in workspace lifecycle
#   * Signed/unsigned integer overflow (UBSAN)
#   * Genuine memory leaks not covered by interpreter-noise suppressions
#
# Non-blocking: scheduled only, never on PR. Failures here open a triage
# task — not a merge gate. See docs/TESTING.md §1.10 for local repro and
# scripts/asan-suppressions.txt for the third-party-noise suppression list.

on:
  schedule:
    # Wednesday 06:00 UTC. Offset from flaky-detect (Sunday) and
    # link-check-external (Monday) to spread runner load across the week.
    - cron: '0 6 * * 3'
  workflow_dispatch:

# Default for every job. issues: write is granted to issue-on-failure alone,
# the only job that files anything, so the jobs that build and run
# sanitizer-instrumented C hold a read-only token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # don't cancel a long-running sanitizer job

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: gcc  # explicit — matches LD_PRELOAD path; see RESEARCH §"Open Questions Q1"
      JAMMA_SANITIZE: "address,undefined"
      JAMMA_FORCE_NUMPY_FALLBACK: "1"
      # ASAN options (RESEARCH §"Pitfall 8" — `>-` folded scalar escapes ':' YAML mapping char):
      #   detect_leaks=1            — leak detection on (with suppressions for noise)
      #   abort_on_error=1          — exit non-zero immediately on first finding
      #   strict_string_checks=1    — strcmp/strcpy bounds-strict
      #   allocator_may_return_null=1 — NumPy intentionally tests OOM paths
      #   suppressions=...          — third-party noise only
      #   symbolize=1, print_stacktrace=1 — readable traces in CI logs
      # ASAN_OPTIONS does NOT carry suppressions — the file is in LSAN-suppression
      # format (`leak:<symbol>` lines), and ASan aborts with "failed to parse
      # suppressions" if it tries to read those as ASan-format patterns. The
      # leak suppressions belong to LSAN_OPTIONS below.
      #
      # detect_leaks=0: leak detection on a full pytest run produces a long
      # tail of CPython/NumPy interpreter-shutdown leaks (run 25110704752
      # surfaced ~12 MB across 400+ objects in 50+ distinct symbol prefixes).
      # Maintaining an exhaustive LSan suppression list is more code than
      # signal — ASan still catches the bugs we care about (heap-buffer-
      # overflow, use-after-free, double-free, stack overflow). LeakSanitizer
      # remains opt-in via the dedicated leak-hunt job (see
      # asan-sentinel-meta-test for the wiring proof).
      ASAN_OPTIONS: >-
        detect_leaks=0:abort_on_error=1:strict_string_checks=1:allocator_may_return_null=1:symbolize=1:print_stacktrace=1
      UBSAN_OPTIONS: >-
        halt_on_error=1:print_stacktrace=1:symbolize=1
      LSAN_OPTIONS: >-
        suppressions=${{ github.workspace }}/scripts/asan-suppressions.txt:print_suppressions=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      # JAMMA_SANITIZE (job env, above) flows through apply_sanitizer_overrides()
      # in _build_support/compile_and_link.py during the action's compile steps.
      - name: Set up JAMMA
        uses: ./.github/actions/setup-jamma

      - name: Run pytest under ASAN/UBSAN
        # `shell: bash` makes GitHub run this with `bash --noprofile --norc
        # -eo pipefail {0}`, so a pytest crash (sanitizer abort, segfault)
        # propagates through the `| tee` pipe and fails the step. Without
        # pipefail, tee exits 0 and the step would silently pass even on
        # an actual ASan finding — making the issue-on-failure triage path
        # unreachable.
        shell: bash
        run: |
          # LD_PRELOAD libasan so the ASAN runtime is loaded BEFORE Python
          # starts and the instrumented .so files can find their interceptors.
          # Must use the same compiler that built the .so files (CC=gcc above).
          # SC2155: declare-and-export must be split so the subshell
          # exit code is visible. `set -eo pipefail` then propagates a
          # gcc lookup failure rather than silently exporting "".
          LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export LD_PRELOAD
          echo "LD_PRELOAD=$LD_PRELOAD"
          echo "ASAN_OPTIONS=$ASAN_OPTIONS"
          # Exclude two classes of tests that are not meaningful under
          # the sanitizer harness:
          #
          # 1. Subprocess-LD_PRELOAD pollution (RESEARCH §"Pitfall 6"):
          #    LD_PRELOAD=libasan.so propagates to every subprocess pytest
          #    forks. Build-tooling probes (gcc --version, python -O ...,
          #    python -m jamma ...) abort with LSAN-detected internal leaks
          #    or interpreter-init noise at shutdown (exit -6 / SIGABRT).
          #    Those tests exercise build-time correctness, not runtime
          #    behaviour we want sanitizer coverage on.
          #
          # 2. C-extension-required tests under JAMMA_FORCE_NUMPY_FALLBACK=1:
          #    The fallback gate skips the .so import (intentional, so
          #    ASan + dlopen + BLAS interactions don't drown real findings).
          #    Tests asserting "the C extension IS loaded" obviously fail
          #    here — they belong in the regular CI matrix.
          #
          # Long-term fix: tag affected tests with a
          # @pytest.mark.requires_c_extension marker and use -m to filter.
          # Short-term: explicit --ignore / --deselect of the known set.
          uv run pytest \
            -m "not benchmark and not slow" \
            -v -n 0 -p no:randomly \
            -o 'addopts=--timeout=300' \
            --ignore=tests/test_sanitizer_sentinel.py \
            --ignore=tests/test_c_extensions_ci.py \
            --ignore=tests/test_compile_accel_sentinel_injection.py \
            --deselect tests/test_conftest_tier_gate.py::TestGateUnderXdist::test_gate_passes_when_marked_under_xdist \
            --deselect tests/test_jlinalg_dgemm.py::TestDgemmThreadSafety::test_single_vs_multi_thread \
            --deselect tests/test_jlinalg_eigh.py::TestThreadControl::test_set_n_threads_accepts_large \
            --deselect tests/test_lmm_io_validation.py::test_python_m_jamma_help \
            --deselect tests/test_numpy_streaming.py::TestStreamingPipeline::test_streaming_pipeline_activates \
            --deselect tests/test_safety_gates.py::TestJlinalgABIValidation::test_abi_mismatch_triggers_production_guard_at_runtime \
            --deselect tests/test_safety_gates.py::TestLOCOIteratorRuntimeError::test_loco_module_imports_cleanly_under_optimisation \
            --deselect tests/test_snp_stats.py::TestSnpStatsC::test_c_extension_loaded \
            --deselect tests/test_snp_stats.py::TestSnpStatsC::test_dtype_parity \
            --deselect tests/test_snp_stats.py::TestSnpStatsC::test_float32_parity \
            --deselect tests/test_snp_stats.py::TestSnpStatsC::test_rectangular_chunk \
            2>&1 | tee sanitizer-run.log

      - name: Upload sanitizer logs
        if: always()  # success AND failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sanitizer-logs-${{ github.run_id }}
          path: sanitizer-run.log
          retention-days: 30

  asan-sentinel-meta-test:
    # Proves the sanitizer is wired by deliberately seeding a heap-OOB and
    # asserting ASAN catches it. If this job exits 0 silently, the
    # sanitizer is NOT engaged — that is itself a workflow failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: gcc
      JAMMA_SANITIZE: "address,undefined"
      JAMMA_FORCE_NUMPY_FALLBACK: "1"
      JAMMA_SENTINEL_UB: "1"  # opts the heap-OOB function into the .so
      JAMMA_SANITIZE_EXPECT_FAIL: "1"  # opts in the sentinel pytest
      # log_path writes ASan's trace to <path>.<pid> via direct file write —
      # survives the SIGABRT that abort_on_error=1 triggers, where a piped
      # `tee` can lose the trace because the child process dies before
      # buffered stderr is flushed (run 25108167688 symptom).
      ASAN_OPTIONS: >-
        detect_leaks=0:abort_on_error=1:symbolize=1:print_stacktrace=1:log_path=${{ github.workspace }}/asan-trace
      UBSAN_OPTIONS: >-
        halt_on_error=1:print_stacktrace=1:symbolize=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      # build-extensions: false — this job compiles only _lmm_accel (below),
      # never jlinalg. JAMMA_SENTINEL_UB is accel-only (compile_and_link.py's
      # reads_sentinel_env), so a jlinalg build here would just spend time
      # instrumenting a module the sentinel test never touches.
      - name: Set up JAMMA
        uses: ./.github/actions/setup-jamma
        with:
          build-extensions: "false"

      - name: Compile _lmm_accel with -DJAMMA_SENTINEL_UB
        # JAMMA_SENTINEL_UB env var causes _compile_accel.py to inject
        # -DJAMMA_SENTINEL_UB into extra_cflags. Combined with
        # JAMMA_SANITIZE above, the .so is also instrumented.
        run: uv run python -m jamma.lmm._compile_accel

      - name: Run sentinel — MUST fail with heap-buffer-overflow
        # continue-on-error: true lets the workflow continue past the
        # expected pytest failure so we can grep the log and assert the
        # right kind of failure happened. Without this, an actual sentinel
        # hit would fail the WORKFLOW, but we want the workflow to be GREEN
        # when the sentinel fires correctly (proving sanitizer wiring works)
        # and RED when the sentinel returns silently (sanitizer broken).
        continue-on-error: true
        id: sentinel
        run: |
          # SC2155: declare-and-export must be split so the subshell
          # exit code is visible. `set -eo pipefail` then propagates a
          # gcc lookup failure rather than silently exporting "".
          LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export LD_PRELOAD
          # Use `> file 2>&1` (not `| tee`): the tee pipeline can lose
          # buffered output when ASan's abort_on_error=1 SIGABRTs the
          # process before the kernel flushes the pipe to tee. Direct
          # file redirection survives SIGABRT. -s disables pytest's
          # stdout capture so test-internal CHECKPOINT prints land in
          # the file immediately. Override addopts because the project's
          # pyproject.toml pins pytest-randomly args that conflict with
          # -p no:randomly.
          set +e
          uv run pytest \
            tests/test_sanitizer_sentinel.py \
            -v -s -n 0 -p no:randomly \
            -o 'addopts=--timeout=120' \
            > sentinel-run.log 2>&1
          pytest_exit=$?
          set -e
          echo "pytest exit code: $pytest_exit"
          echo "exit_code=$pytest_exit" >> "$GITHUB_OUTPUT"
          # Display the captured output so the workflow log mirrors what
          # CI used to show under | tee — the asserter step will also
          # cat it later for grep purposes.
          cat sentinel-run.log

      - name: Assert sanitizer caught the deliberate OOB
        # The sentinel function reads buf[5] on a malloc(4) buffer. Either
        # sanitizer can catch this — ASan reports "heap-buffer-overflow",
        # UBSAN reports "runtime error: load of address ... with insufficient
        # space for an object". Both signatures count as "wired"; we accept
        # whichever fires first. Run 25109515712 confirmed UBSAN's bounds
        # check fires before ASan's redzone check on this construct.
        #
        # The asserter compiles all available trace sources — the
        # log_path-targeted asan-trace.* files (direct write, survives
        # SIGABRT) plus the redirected sentinel-run.log — into a combined
        # stream and greps that.
        run: |
          shopt -s nullglob
          combined_trace=$(mktemp)
          for f in "$GITHUB_WORKSPACE"/asan-trace.* sentinel-run.log; do
            if [ -f "$f" ]; then
              echo "===== $f =====" >> "$combined_trace"
              cat "$f" >> "$combined_trace"
            fi
          done
          # Either sanitizer signature is accepted.
          if grep -E -q "AddressSanitizer:.*heap-buffer-overflow|runtime error:.*(load|store|index).*out of bounds|runtime error:.*insufficient space" "$combined_trace"; then
            echo "OK: sanitizer caught the deliberate OOB — wiring is live"
            # SC-4 source-line attribution: trace must point at _lmm_accel.c.
            if grep -q "_lmm_accel.c" "$combined_trace"; then
              echo "OK: trace mentions _lmm_accel.c — source-line attribution works"
              # Identify which sanitizer fired (informational).
              if grep -q "AddressSanitizer:.*heap-buffer-overflow" "$combined_trace"; then
                echo "  (sanitizer: ASan heap-buffer-overflow)"
              else
                echo "  (sanitizer: UBSAN out-of-bounds)"
              fi
              exit 0
            else
              echo "FAIL: OOB caught but trace does not mention _lmm_accel.c"
              echo "Sentinel may be running but stack-trace symbolization is broken."
              echo "----- combined trace -----"
              tail -200 "$combined_trace"
              exit 1
            fi
          else
            echo "FAIL: sentinel did not produce any sanitizer trace"
            echo "Neither ASan heap-buffer-overflow nor UBSAN out-of-bounds matched."
            echo "Combined trace contents:"
            tail -200 "$combined_trace"
            exit 1
          fi

      - name: Upload sentinel logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sentinel-logs-${{ github.run_id }}
          path: |
            sentinel-run.log
            asan-trace.*
          retention-days: 30

  issue-on-failure:
    # Open or update a triage issue when EITHER the main asan-ubsan job
    # OR the asan-sentinel-meta-test job fails. Mirrors flaky-detect.yml's
    # pattern. The sentinel job failing is itself an actionable signal —
    # it means the sanitizer-wiring proof is broken, which is exactly the
    # condition the triage path exists to surface.
    needs: [asan-ubsan, asan-sentinel-meta-test]
    if: >-
      always() &&
      (needs.asan-ubsan.result == 'failure' ||
       needs.asan-sentinel-meta-test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # to file a triage issue on sanitizer detection
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: List failed jobs
        id: failed
        env:
          ASAN_RESULT: ${{ needs.asan-ubsan.result }}
          SENTINEL_RESULT: ${{ needs.asan-sentinel-meta-test.result }}
        run: |
          jobs=()
          [ "$ASAN_RESULT" = "failure" ] && jobs+=("asan-ubsan")
          [ "$SENTINEL_RESULT" = "failure" ] && jobs+=("asan-sentinel-meta-test")
          IFS=', '; echo "list=${jobs[*]}" >> "$GITHUB_OUTPUT"

      - name: Open or update sanitizer-triage issue
        uses: ./.github/actions/triage-issue
        with:
          title: "Sanitizers (ASAN/UBSAN): weekly run failed"
          label: sanitizer
          body: |
            Sanitizer run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed.

            Failed jobs: ${{ steps.failed.outputs.list }}

            Inspect the workflow logs and the uploaded sanitizer-logs-${{ github.run_id }} / sentinel-logs-${{ github.run_id }} artifacts.

            Reproduce locally with the steps in docs/TESTING.md §1.10.
            This is a non-blocking triage signal — not a merge regression.
