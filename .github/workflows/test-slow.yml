name: Slow Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs — slow tests take ~20 min each so this is the
# highest-value cancellation target.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up JAMMA
        uses: ./.github/actions/setup-jamma

      - name: Run slow and tier2 tests
        run: uv run pytest -m "tier2 or slow" -v -o 'addopts=' --no-cov
