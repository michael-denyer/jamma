name: Slow Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs — slow tests take ~20 min each so this is the
# highest-value cancellation target.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run slow and tier2 tests
        run: uv run pytest -m "tier2 or slow" -v -o 'addopts=' --no-cov
