name: Slow Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run slow and tier2 tests
        run: uv run pytest -m "(tier2 or slow) and not tier3" -v -o 'addopts=' --no-cov
