name: Slow Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs — slow tests take ~20 min each so this is the
# highest-value cancellation target.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up JAMMA
        uses: ./.github/actions/setup-jamma

      - name: Run slow and tier2 tests
        run: uv run pytest -m "tier2 or slow" -v -o 'addopts=' --no-cov

      - name: Complete mathematical mutation suite
        run: uv run python scripts/mathematical_mutations.py --all --output "$RUNNER_TEMP/mutations.json"

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: mathematical-mutations-all
          path: ${{ runner.temp }}/mutations.json
          if-no-files-found: error
