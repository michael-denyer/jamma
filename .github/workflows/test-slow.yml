name: Slow Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs — slow tests take ~20 min each so this is the
# highest-value cancellation target.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run slow and tier2 tests
        run: uv run pytest -m "tier2 or slow" -v -o 'addopts=' --no-cov
