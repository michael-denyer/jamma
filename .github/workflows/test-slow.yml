name: Slow Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs — slow tests take ~20 min each so this is the
# highest-value cancellation target.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Compile C extensions
        run: |
          uv run python -m jamma.lmm._compile_accel

      - name: Compile jlinalg extension
        run: |
          uv run python -m jamma.jlinalg._compile_jlinalg

      - name: Run slow and tier2 tests
        run: uv run pytest -m "(tier2 or slow) and not tier3" -v -o 'addopts=' --no-cov
