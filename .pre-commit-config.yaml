repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-added-large-files
        # 500 KB cap. Binary fixtures live in tests/fixtures/ and are
        # already checked in; this cap blocks *new* accidental binaries
        # (stray .npy, .bed, cached compiler outputs) without rejecting
        # the existing ones.
        args: [--maxkb=500]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c]
        files: ^src/jamma/jlinalg/src/
  # GitHub Actions workflow linter. Catches missing pipefail / shell mode,
  # bad expression syntax, deprecated action versions, and ${{}} injection
  # patterns. Phase 116.1's verification cycle would have lost ~6 cycles
  # to remote dispatch had this run locally first (review HIGH finding,
  # commit cbd7127). Includes shellcheck integration for `run:` blocks.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # Workflow security audit. Catches privilege escalation paths, SHA-pin
  # drift across workflows, untrusted-input expansion in `run:`, and
  # pull_request_target misuse. Defence-in-depth for the SHA-pinned
  # posture this repo already takes per CLAUDE.md "CI/CD Hardening".
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
        # Default severity, not `--min-severity high`: the pre-existing
        # high and medium findings are fixed, so there is no bar to raise
        # and no ignore rule left. See .zizmor.yml.
        args: ["--config", ".zizmor.yml"]
  # Standalone shellcheck for shell scripts under scripts/. The
  # actionlint integration above covers `run:` blocks inside workflow
  # YAML; this hook catches `scripts/*.sh` files that aren't part of
  # any workflow. Together they reach all shell logic in the repo.
  # shellcheck-py wraps the binary so no Docker daemon is required.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
  # Dead-code detector. Surfaces unreachable functions, unused imports,
  # and stale test fixtures. Run with high confidence (95%) to keep
  # false-positive noise low — flags only obvious dead code, not
  # speculative `_unused` arg parameters.
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args:
          - "--min-confidence"
          - "95"
          - ".vulture-allowlist.py"
          - "src/"
          - "scripts/"
  # Modernization hints. Catches Python idioms ruff doesn't fully cover
  # (membership tests over repeated comparisons, contextlib.suppress over
  # try/except/pass, fluent chaining). No longer `stages: [manual]`: the
  # pre-existing findings it shipped with are fixed, so it gates every
  # commit. Where refurb and ruff implement the same rule, the decision
  # lives once in [tool.refurb] in pyproject.toml — see the note there.
  - repo: https://github.com/dosisod/refurb
    rev: v2.3.1
    hooks:
      - id: refurb
        files: ^src/.*\.py$
  # Markdown link checker. Pre-commit runs lychee in --offline mode so it
  # only verifies file paths and in-repo anchors — fast, deterministic, no
  # network. CI runs the same binary with the same lychee.toml config but
  # without --offline, so external links get checked too (see
  # .github/workflows/ci.yml).
  #
  # Consistency: lychee.toml is the single source of truth for which paths
  # are excluded and which rule set applies. Pre-commit only adds the
  # --offline flag on top of that shared config. The version below is also
  # what both workflows pin via `lycheeVersion:` — bump all three together,
  # or the modes drift and a broken link passes one check while failing
  # another.
  #
  # LYCHEE_VERSION must be passed explicitly and must stay equal to `rev`.
  # From 0.24.0 the hook script derives the version by running
  # `git describe --exact-match --match 'lychee-*v*'`, assuming it is inside
  # its own cached checkout. Under `git commit` that assumption is false:
  # git exports GIT_DIR, so `git rev-parse --show-toplevel` resolves to THIS
  # repo, `git describe` finds no lychee-* tag, and the hook exits 100 on any
  # commit that touches a .md file. LYCHEE_VERSION= as the first arg is
  # upstream's documented bypass and short-circuits that lookup entirely.
  # (`prek run` does not reproduce the failure — no GIT_DIR is set — so this
  # has to be checked with a real commit that stages a markdown file.)
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        name: lychee (offline link check)
        args:
          - LYCHEE_VERSION=0.24.2
          - --offline
          - --no-progress
          - --config
          - lychee.toml
        files: \.md$
  # Markdown formatting linter. Same shared-config consistency rule as
  # lychee: .markdownlint-cli2.jsonc is the single source of truth for
  # rule config, and the CI markdown-lint job (.github/workflows/ci.yml)
  # runs the same binary with the same config so the two cannot drift.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        files: \.md$
  # Mermaid diagram syntax validator. Wraps @probelabs/maid via a local
  # script (scripts/check-mermaid.sh) so we can gate on parse errors
  # only — maid flags several warnings as false positives on legitimate
  # mermaid features (style on subgraph names, sequenceDiagram
  # deactivate). The wrapper script is also what CI runs, so pre-commit
  # and CI cannot drift.
  - repo: local
    hooks:
      - id: maid-mermaid
        name: maid (mermaid diagram syntax)
        entry: scripts/check-mermaid.sh
        language: script
        files: \.md$
        pass_filenames: false
  # Spell checker for code and docs. Shared config in _typos.toml, same
  # consistency rule as lychee/markdownlint/maid.
  - repo: https://github.com/crate-ci/typos
    rev: v1.45.0
    hooks:
      - id: typos
  - repo: local
    hooks:
      # Covers both C trees. The flags live in the script because this entry is
      # split into arguments without a shell, which would strip the quotes the
      # NPY_INTP_FMT define needs.
      - id: cppcheck
        name: cppcheck
        entry: scripts/run-cppcheck.sh
        language: script
        types: [c]
        files: ^src/jamma/(jlinalg/src|lmm)/
  - repo: local
    hooks:
      - id: uv-lock-sync
        name: uv.lock sync check
        entry: scripts/check-uv-lock.sh
        language: script
        files: ^pyproject\.toml$
        pass_filenames: false
      - id: no-inspect-getsource
        name: ban inspect.getsource in tests
        entry: sh -c '! grep -rn "inspect\.getsource" tests/'
        language: system
        files: ^tests/
        pass_filenames: false
      - id: no-quiet-flags  # allow-quiet: hook name documents the flags it bans
        name: ban --quiet/-q/--silent and hook-skip flags (CLAUDE.md)  # allow-quiet
        entry: scripts/check-quiet-flags.py
        language: system
        # Run repo-wide on every invocation (the script sweeps its own
        # default globs); pass_filenames=false prevents prek from also
        # passing the filtered file list.
        pass_filenames: false
        always_run: true
      - id: check-test-timeouts
        name: flag unjustified long @pytest.mark.timeout values
        entry: scripts/check-test-timeouts.py
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
      - id: check-forbidden-patches
        name: ban patching numerical functions and internal jamma collaborators
        entry: scripts/check-forbidden-patches.py
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
      - id: check-fixture-manifest
        name: GEMMA fixture sha256 manifest matches tests/fixtures/
        entry: uv run python scripts/check_fixture_manifest.py
        language: system
        files: ^tests/fixtures/
        pass_filenames: false
      - id: no-compile-flag-literals-outside-build-support
        name: ban compile-flag literals outside jamma._build_support
        entry: scripts/check-compile-flag-literals.py
        language: system
        files: ^(hatch_build\.py|src/jamma/(jlinalg/_compile_jlinalg|lmm/_compile_accel|core/recompile)\.py|src/jamma/_build_support/)
        pass_filenames: false
      - id: verify-compile-invocations-match
        name: verify compile entry points route through jamma._build_support
        entry: scripts/verify_compile_invocations_match.py
        language: system
        files: ^(hatch_build\.py|src/jamma/(jlinalg/_compile_jlinalg|lmm/_compile_accel)\.py|src/jamma/_build_support/)
        pass_filenames: false
      # Static type checker. Runs whole-project (not per-file), so
      # pass_filenames must stay false. The project is at zero pyrefly
      # errors, so this gate is absolute: any error fails. There is no
      # baseline file to add to — a new error has to be fixed or given a
      # narrow inline `# type: ignore[code]` at the offending line. CI runs
      # the same command as an explicit "Pyrefly type check" step
      # (.github/workflows/ci.yml) so local and CI cannot drift. Config
      # lives in [tool.pyrefly] (pyproject.toml). Reads .pyi stubs, so no
      # compiled C extension needed.
      - id: pyrefly
        name: pyrefly type check
        entry: uv run pyrefly check
        language: system
        # always_run (not a files filter) so config-only edits —
        # pyproject.toml [tool.pyrefly] — also trigger the whole-project
        # gate, not just .py/.pyi changes. Mirrors the no-quiet-flags hook.
        # pass_filenames stays false (project-mode).
        always_run: true
        pass_filenames: false
      - id: ruff-format-all
        name: ruff format (all files)
        entry: uv run ruff format --check .
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: c-extension-freshness
        name: C extensions not stale vs source (rebuild before push)
        entry: uv run python scripts/check_c_extension_freshness.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
