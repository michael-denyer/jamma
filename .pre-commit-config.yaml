repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c]
        files: ^src/jamma/jlinalg/src/
  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --std=c11 --suppress=missingIncludeSystem --enable=warning --error-exitcode=1 --quiet
        language: system
        types: [c]
        files: ^src/jamma/jlinalg/src/
  - repo: local
    hooks:
      - id: uv-lock-sync
        name: uv.lock sync check
        entry: scripts/check-uv-lock.sh
        language: script
        files: ^pyproject\.toml$
        pass_filenames: false
      - id: no-inspect-getsource
        name: ban inspect.getsource in tests
        entry: sh -c '! grep -rn "inspect\.getsource" tests/'
        language: system
        files: ^tests/
        pass_filenames: false
      - id: ruff-format-all
        name: ruff format (all files)
        entry: uv run ruff format --check .
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
