[build-system]
requires = ["hatchling", "numpy>=2.0.0"]
build-backend = "hatchling.build"

[project]
name = "jamma"
version = "5.0.0"
description = "High-performance Multi-method Mixed-Model Association for large-scale GWAS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JAMMA Contributors" }]
keywords = [
    "gwas",
    "genomics",
    "genetics",
    "bioinformatics",
    "gemma",
    "linear-mixed-model",
    "association-testing",
    "kinship",
    "plink",
    "snp",
    "eigendecomposition",
    "wald-test",
    "lmm",
    "reml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "bed-reader>=1.0.0",
    "numpy>=2.0.0",
    "psutil>=5.9.0",
    "threadpoolctl>=3.0.0",
    "click>=8.0.0",
    "loguru>=0.7.0",
    "progressbar2>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/michael-denyer/jamma"
Repository = "https://github.com/michael-denyer/jamma"
Documentation = "https://github.com/michael-denyer/jamma/tree/master/docs"
Changelog = "https://github.com/michael-denyer/jamma/blob/master/CHANGELOG.md"
Issues = "https://github.com/michael-denyer/jamma/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=5.0.0",
    "hypothesis>=6.100.0",
    "hypothesis[numpy]>=6.100.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "ruff>=0.15.0",
    "pre-commit>=3.7.0",
    "slipcover>=1.0.17",
]

[project.scripts]
jamma = "jamma.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 3 --randomly-seed=last --benchmark-skip -m 'not slow and not tier2 and not tier3' --no-cov"
filterwarnings = []
markers = [
    "tier0: fast unit tests (<5s), no external dependencies, no GEMMA reference",
    "tier1: parity tests (<60s), validates against GEMMA reference data",
    "tier2: scale tests (memory/time intensive), requires large memory or long runtime",
    "tier3: heavy scale tests (>60s on CI), run locally only — excluded from CI slow tests",
    "slow: alias for tier2, marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests that require pytest-benchmark (run with '--benchmark-only')",
]

[tool.hatch.build.hooks.custom]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=5.0.0",
    "hypothesis>=6.100.0",
    "hypothesis[numpy]>=6.100.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "ruff>=0.15.0",
    "pre-commit>=3.7.0",
    "pyyaml>=6.0.3",
    "hatchling>=1.29.0",
    "editables>=0.5",
]
