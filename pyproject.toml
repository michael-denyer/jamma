[build-system]
requires = ["hatchling==1.32.0", "numpy==2.4.6"]
build-backend = "hatchling.build"

[project]
name = "jamma"
version = "7.2.0"
description = "Highly-Accelerated Multi-method Mixed-Model Association for large-scale GWAS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JAMMA Contributors" }]
keywords = [
    "gwas",
    "genomics",
    "genetics",
    "bioinformatics",
    "gemma",
    "linear-mixed-model",
    "association-testing",
    "kinship",
    "plink",
    "snp",
    "eigendecomposition",
    "wald-test",
    "lmm",
    "reml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "bed-reader>=1.0.0",
    "numpy>=2.4.6",
    "psutil>=5.9.0",
    "threadpoolctl>=3.0.0",
    "click>=8.0.0",
    "loguru>=0.7.0",
    "progressbar2>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/michael-denyer/jamma"
Repository = "https://github.com/michael-denyer/jamma"
Documentation = "https://github.com/michael-denyer/jamma/tree/master/docs"
Changelog = "https://github.com/michael-denyer/jamma/blob/master/CHANGELOG.md"
Issues = "https://github.com/michael-denyer/jamma/issues"

# Mirror of [dependency-groups] dev — kept so `pip install -e '.[dev]'` works
# for contributors not using uv. Update both sections together.
# NOTE: scipy is intentionally excluded here (present in [dependency-groups] only)
# because `pip install .[dev]` would overwrite ILP64 numpy with LP64 scipy's numpy.
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=15.0",
    "hypothesis>=6.100.0",
    "hypothesis[numpy]>=6.100.0",
    "pandas>=2.0.0",
    "ruff>=0.15.7",
    # Exact-pinned: the gate is "zero pyrefly errors", so a minor bump that
    # adds a check or reclassifies one turns green into red with no code
    # change. Bump deliberately and fix what it finds in the same commit.
    # Keep in sync with [dependency-groups].
    "pyrefly==1.2.0",
    "pyyaml>=6.0.3",
    "slipcover>=1.0.17",
    "hatchling>=1.29.0",
    "mpmath==1.4.1",
]

[project.scripts]
jamma = "jamma.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --timeout=120: kill any test that hangs past 2 minutes. Tier0/tier1 tests
# should finish in under 60s each; the 120s cap exists to catch accidental
# BLAS-on-100k-samples calls, deadlocks, and infinite loops. Tests that
# genuinely need longer should be tagged with @pytest.mark.timeout(N) and
# almost certainly want a tier2/slow marker as well.
addopts = "-n 3 --randomly-seed=last --benchmark-skip --timeout=120 -m 'not slow and not tier2' --no-cov"
filterwarnings = []
markers = [
    "tier0: fast unit tests (<5s), no external dependencies, no GEMMA reference",
    "tier1: parity tests (<60s), validates against GEMMA reference data",
    "tier2: scale tests (memory/time intensive), requires large memory or long runtime",
    "slow: independent slow marker (long but not memory-bound) — runs in test-slow.yml",
    "benchmark: marks tests that require pytest-benchmark (run with '--benchmark-only')",
    "requires_c: skips when the _lmm_accel C extension is not available",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
# Source builds need src/jamma/_build_support/ for the hatch build hook;
# it's the single source of truth for compile flags, LAPACK split, and the
# compile+link driver. Ships inside src/jamma so runtime recompile can
# reach it (see [tool.hatch.build.targets.wheel] below).
include = [
    "src/jamma/",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "tests/",
]

[tool.hatch.build.targets.wheel]
# jamma._build_support ships inside the installed package so that runtime
# ABI-mismatch recompile (jamma.core.recompile.auto_recompile_c_extension)
# can reach the same compile+link helpers the wheel was built with. The
# underscore prefix marks it as internal/unstable API — third parties must
# not import from it.
packages = ["src/jamma"]

[tool.pyrefly]
# Static type checking (run in CI lint job + prek hook).
# project-includes: the source trees we type-check. Generated/vendored
# files are left to pyrefly's default excludes (.venv, build, __pycache__).
project-includes = ["src", "tests", "scripts"]
# search-path: import roots so cross-tree imports resolve.
#   src      → the `jamma` package (inferred, but listed explicitly).
#   scripts  → top-level script modules imported by tests via sys.path
#              insertion (e.g. `import check_c_extension_freshness`).
#   .        → the repo root, so the `tests` package (tests/__init__.py)
#              resolves for `from tests.conftest import ...`.
search-path = ["src", "scripts", "."]
# Check against the floor of requires-python (>=3.11), not the CI runner's
# 3.12, so usage of 3.12-only syntax/stdlib is caught.
python-version = "3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
# .vulture-allowlist.py uses vulture's pseudo-Python `_.<name>` syntax
# (see jendrikseipp/vulture#147 for the convention). It is config data,
# not source — ruff would flag every line as F821 "undefined name `_`".
extend-exclude = [".vulture-allowlist.py"]

[tool.ruff.lint]
# Expanded rule set. Additions beyond the original E/F/I/UP/B:
#   SIM  — flake8-simplify (nested ifs, redundant conditions, dict.get idioms)
#   RUF  — ruff-specific checks (bugs ruff authors found in real code)
#   C4   — flake8-comprehensions (list(map(...)) → comprehension, etc.)
#   PIE  — flake8-pie (no-op removal, startswith/endswith tuples)
#   PERF — perflint (hot-path perf footguns — relevant for JAMMA's numerics)
#   NPY  — numpy-specific rules (catches np.bool/np.int deprecations and
#          numpy 2.x migration footguns; relevant to our pinned numpy 2.4.x)
#   PT   — flake8-pytest-style (consistent pytest idioms)
#   PTH  — flake8-use-pathlib (os.path → pathlib migration)
#   BLE  — flake8-blind-except (bans bare `except:` / `except Exception:`
#          which masks programming bugs behind fallback paths — the same
#          class of defect fixed in core/recompile.py review fix C2)
select = [
    "E", "F", "I", "UP", "B",
    "SIM", "RUF", "C4", "PIE", "PERF", "NPY", "PT", "PTH", "BLE",
]
ignore = [
    # Allow pytest.raises to wrap multiple statements — expressive test setup
    # is often clearer than single-line `with pytest.raises(...): target()`.
    "PT012",
    # perflint try/except-in-loop warning — sometimes the try is the point.
    "PERF203",
    # RUF059 flags unused unpacked variables. JAMMA routinely unpacks
    # long tuples from LMM functions where prefixing every unused return
    # with an underscore would be noisier than leaving `x, y, z = f()`.
    # Keep the full unpacking as documentation of what the function returns.
    "RUF059",
    # PTH123 rewrites `open(path)` to `Path(path).open()` — idiomatic
    # open() is perfectly fine and the rewrite just adds verbosity.
    "PTH123",
    # JAMMA uses mathematical Unicode intentionally: `n × n` for matrix
    # dimensions, `–` for en-dash in ranges, `ℓ` for log-likelihood in
    # documentation. RUF001/002/003 would force us to rewrite these as
    # ASCII `x`/`-`/`l`, which is actively wrong in a numerical library.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use magic numbers, long lines for readable tables, and
# less-strict import organization. Relax the loud rules there.
"tests/**" = [
    "PT011",   # pytest.raises without a match — often intentional
    "PT006",   # parametrize arg style — existing tests use tuple/str mix
    "PERF401", # explicit loops in tests are clearer than comprehensions
    "SIM117",  # nested with — clearer step-by-step in tests
]
# Scripts are ad-hoc tooling, not library code.
"scripts/**" = ["PERF401", "SIM117", "PTH"]

[tool.refurb]
# refurb overlaps ruff, so where the two rules are the same rule, the decision
# must live in one place or the tools contradict each other — the same failure
# mode as the one-lychee-config note in CLAUDE.md.
#
# Suppressions go here rather than as inline `# noqa: FURB…`, because ruff
# flags an unrecognised code in a noqa it does not own (RUF100/RUF102) and
# would need `lint.external` to stay quiet. One config beats two.
ignore = [
    # FURB117 rewrites `open(path)` to `path.open()`. That is exactly ruff's
    # PTH123, which [tool.ruff.lint].ignore already turns off as "idiomatic
    # open() is perfectly fine and the rewrite just adds verbosity". Keeping
    # FURB117 on would have refurb demanding what ruff declines to ask for.
    "FURB117",
]

[[tool.refurb.amend]]
# _EIGEN_ALPHA = 2.7152 is a fitted power-law exponent, not Euler's number.
# FURB152 pattern-matches any float near 2.718; applying it would swap a
# calibrated constant for math.e and silently move every eigendecomp estimate.
path = "src/jamma/core/estimates.py"
ignore = ["FURB152"]

[[tool.refurb.amend]]
# `if gk is None and lmm is None` sits directly below its mirror image,
# `if gk is not None and lmm is not None`. Chaining one and not the other
# makes the pair harder to read than either form alone.
path = "src/jamma/cli.py"
ignore = ["FURB124"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=15.0",
    "hypothesis>=6.100.0",
    "hypothesis[numpy]>=6.100.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "ruff>=0.15.7",
    # Exact-pinned — see the note in [project.optional-dependencies].dev.
    "pyrefly==1.2.0",
    "pyyaml>=6.0.3",
    "slipcover>=1.0.17",
    "hatchling>=1.29.0",
    "mpmath==1.4.1",
]
